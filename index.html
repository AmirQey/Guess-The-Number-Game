<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Guess the Word</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- the first row to put restart button -->
        <div class="container1">
            <button type="reset" class="button-green" onclick="location.reload()">Restart</button>
        </div>

        <!-- second row for numbers form -->
        <div class="container2">
            <h3>Enter the range number</h3>
            <form>
                <input type="number" id="min-range" placeholder="Minimun range">
                <input type="number" id="max-range" placeholder="Maximum range">
                <input type="number" id="lock-number" placeholder="Lock your number">
            </form>
            <button type="button" class="button-green" id="lock">Lock</button>
        </div> 

        <!-- third row includes 2 columns box -->
        <div style="display: flex; gap: 200px;">

            <!-- first column box includes 3 rows -->
            <div class="container3">

                <!-- First row -->
                <h3>Your guess should be</h3>

                <!-- Second row includes 2 number boxes -->
                <div style="display: flex; flex-direction: row;">
                    <div class="box">
                        <h3>Higher than</h3>
                        <div class="box-number" id="min-guess">
                        </div>
                    </div>
                    <div class="box">
                        <h3>Lower than</h3>
                        <div class="box-number" id="max-guess">
                        </div>
                    </div>
                </div>  

                <!-- Third row -->
                <div style="display: flex; margin-top: 20px; margin-left: 20px;">
                    <input type="number" placeholder="Put guess number here" id="guess-number">
                    <button id="guess-btn" class="button-pink">Guess</button>
                </div>
            </div>

            <!-- second column box includes 2 rows -->
            <div class="container3" style="background: var(--soft); padding: 20px; border-radius: 30px; box-shadow: 18px 18px var(--black); border: 1px solid var(--black);">
                
                <!-- first row -->
                <h3>Is this your number ?</h3>

                <!-- second row includes 3 rows -->
                <div class="box" style="margin-left: 0;">

                    <!-- first row to display the number box -->
                    <div class="box-number" id="bot-guess">    
                    </div>

                    <!-- 2 buttons for second row-->
                    <div style="display: flex; margin-top: 10px;">
                        <button class="button-pink" id="higher">Higher</button>
                        <button class="button-pink" id="lower">Lower</button>
                    </div>

                    <!-- third row -->
                    <button  class="button-pink" id="correct">You got it!</button>
                </div>
            </div>
        </div>

        <!-- Hidden popups -->

        <!-- Win popup -->
        <div class="popup" id="popup-win">
